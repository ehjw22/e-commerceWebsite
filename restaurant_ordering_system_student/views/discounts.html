<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .badge-type {
            font-size: 0.85rem;
        }

        .card-title {
            margin-bottom: 0;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        #targetProductSection {
            display: none;
        }

        textarea {
            resize: none;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
        <a class="navbar-brand" href="/">Restaurant Ordering System</a>

        <div class="d-flex align-items-center gap-2 ms-auto">
            <a href="/member/products" class="btn btn-primary btn-sm">Products</a>
            <a href="/member/discounts" class="btn btn-success btn-sm">Discounts</a>
            <a href="/member/feedback" class="btn btn-warning btn-sm">Feedback</a>
            <a href="/member/cart" class="btn btn-info btn-sm text-white">Cart</a>
            <span class="navbar-text ms-2 me-2">Welcome, Member</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
        </div>
    </nav>

    <main class="container mt-4">
        <h2>Discount Management</h2>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3">Filters</h5>
                <form id="filter-form">
                    <div class="row">
                        <div class="col-md-4">
                            <label class="form-label">Search</label>
                            <input
                                type="text"
                                id="searchInput"
                                class="form-control"
                                placeholder="Search by discount name">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Discount Type</label>
                            <select
                                class="form-select"
                                id="filterType">

                                <option value="">All Types</option>
                                <option value="PRODUCT_QUANTITY">Product Quantity</option>
                                <option value="CART_TOTAL">Cart Total</option>
                                <option value="DELIVERY">Delivery</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="filterStatus">
                                <option value="">All</option>
                                <option value="true">Active</option>
                                <option value="false">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-md-3 d-flex align-items-end">

                            <button
                                type="button"
                                class="btn btn-primary me-2"
                                onclick="loadDiscounts()">
                                Apply Filters
                            </button>

                            <button
                                type="button"
                                class="btn btn-secondary"
                                onclick="clearFilters()">
                                Clear
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title">Available Discounts</h5>
                    <button
                        class="btn btn-success"
                        onclick="openAddModal()">

                        <i class="bi bi-plus-lg"></i>
                        Add Discount
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Trigger</th>
                            <th>Discount</th>
                            <th>Target Product</th>
                            <th>Status</th>
                            <th width="180">Actions</th>
                        </tr>

                        </thead>

                        <tbody id="discountTableBody"></tbody>

                    </table>
                </div>
            </div>
        </div>

        <div class="modal fade" id="discountModal">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">
                            Add Discount
                        </h5>

                        <button
                            class="btn-close"
                            data-bs-dismiss="modal">
                        </button>
                    </div>

                    <div class="modal-body">
                        <form id="discountForm">

                            <input type="hidden" id="discountId">
                            <div class="row">
                                <div class="col-md-6 mb-3">

                                    <label class="form-label">
                                        Discount Name
                                    </label>

                                    <input class="form-control" id="name" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">
                                        Discount Type
                                    </label>

                                    <select class="form-select" id="discountType" onchange="toggleTargetProduct()">
                                        <option value="PRODUCT_QUANTITY">Product Quantity</option>
                                        <option value="CART_TOTAL">Cart Total</option>
                                        <option value="DELIVERY">Delivery</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Description
                                </label>

                                <textarea class="form-control" rows="3" id="description"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Minimum Trigger</label>

                                    <input type="number" step="0.01" class="form-control" id="minTrigger">
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Maximum Trigger</label>

                                    <input type="number" step="0.01" class="form-control" id="maxTrigger">
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Discount Value</label>

                                    <input type="number" step="0.01" class="form-control" id="value">
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Value Type</label>

                                    <select class="form-select" id="valueType">
                                        <option value="PERCENTAGE">Percentage (%)</option>
                                        <option value="FIXED_AMOUNT">Fixed Amount ($)</option>
                                    </select>

                                </div>
                            </div>

                            <div class="mb-3" id="targetProductSection">

                                <label class="form-label">Target Product</label>

                                <select class="form-select"id="targetProduct">
                                    <option value="">Select Product</option>
                                </select>

                            </div>

                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    checked
                                    id="isActive">

                                <label class="form-check-label">Active</label>

                            </div>
                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-primary" onclick="saveDiscount()">Save Discount</button>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/discounts.js"></script>
</body>
</html>
