<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Member View</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Your custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3">Welcome, Member</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mt-4">

    <!-- Back Button -->
    <div class="mb-3">
      <a href="/member/products" class="btn btn-outline-secondary btn-sm">
        ← Back to Products
      </a>
    </div>

    <!-- Loading State -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Error State -->
    <div id="error-message" class="alert alert-danger" style="display: none;">
      Failed to load product details.
    </div>

    <!-- Product Detail Card -->
    <div id="product-detail" style="display: none;">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title mb-4" id="detail-name"></h4>

          <table class="table table-striped align-middle">
            <tbody>
              <tr>
                <th scope="row" style="width: 200px;">Category</th>
                <td id="detail-category"></td>
              </tr>
              <tr>
                <th scope="row">Description</th>
                <td id="detail-description"></td>
              </tr>
              <tr>
                <th scope="row">Price</th>
                <td id="detail-price"></td>
              </tr>
              <tr>
                <th scope="row">Status</th>
                <td id="detail-status"></td>
              </tr>
              <tr>
                <th scope="row">Created At</th>
                <td id="detail-created-at"></td>
              </tr>
            </tbody>
          </table>

        </div>
      </div>
    </div>

    <!-- Feedback section -->
    <div class="mt-5 d-flex flex-column align-items-center w-100">

      <h4 class="mb-3">Customer Feedback</h4>

      <!-- Leave Feedback-->
      <div class="card mb-4 w-100" style="max-width:650px;">
        <div class="card-body">

          <h6 class="mb-3">Write a comment</h6>

          <div class="mb-2">
            <label class="form-label">Rating: <span id="rating-value">3</span>/5</label>

            <input
              type="range"
              min="1"
              max="5"
              value="3"
              class="form-range"
              id="rating-input"
              oninput="document.getElementById('rating-value').innerText = this.value"
            />
          </div>

          <div class="d-flex gap-4">
            <textarea
              id="comment-input"
              class="form-control"
              rows="1"
              placeholder="Add a comment..."
            ></textarea>

            <button class="btn btn-success" onclick="submitFeedback()">
              Post
            </button>
          </div>

        </div>
      </div>

      <!-- Feedback list -->
      <div id="feedback-section" class="w-100 d-flex flex-column align-items-center" style="max-width: 650px;">
        <div id="feedback-list" class="w-100 d-flex flex-column align-items-center"></div>
      </div>

      <!-- No feedback -->
      <div id="no-feedback" class="alert alert-info mt-3" style="display:none;">
        No feedback yet. Be the first to comment.
      </div>

    </div>

    <div class="modal fade" id="editFeedbackModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title">Edit Feedback</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal">
            </button>
          </div>

          <div class="modal-body">

            <input type="hidden" id="edit-feedback-id">

            <div class="mb-3">
              <label class="form-label">Rating</label>
              <input
                type="range"
                min="1"
                max="5"
                value="3"
                class="form-range"
                id="edit-rating"
                oninput="document.getElementById('edit-rating-value').innerText = this.value"
              >
              <small>
                Rating:
                <span id="edit-rating-value">3</span>/5
              </small>
            </div>

            <div class="mb-3">
              <label class="form-label">Comment</label>
              <textarea
                id="edit-comment"
                class="form-control"
                rows="4">
              </textarea>
            </div>

          </div>

          <div class="modal-footer">
            <button
              class="btn btn-secondary"
              data-bs-dismiss="modal">
              Cancel
            </button>

            <button
              class="btn btn-primary"
              onclick="saveFeedback()">
              Save Changes
            </button>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script type="module" src="/js/product-detail.js"></script>
</body>
</html>
