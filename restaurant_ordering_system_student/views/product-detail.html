<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Member View</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Your custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar (identical to products.html) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3">Welcome, Member</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mt-4">

    <!-- Back Button -->
    <div class="mb-3">
      <a href="/member/products" class="btn btn-outline-secondary btn-sm">
        ← Back to Products
      </a>
    </div>

    <!-- Loading State -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Error State -->
    <div id="error-message" class="alert alert-danger" style="display: none;">
      Failed to load product details.
    </div>

    <!-- Product Detail Card -->
    <div id="product-detail" style="display: none;">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title mb-4" id="detail-name"></h4>

          <table class="table table-striped align-middle">
            <tbody>
              <tr>
                <th scope="row" style="width: 200px;">Category</th>
                <td id="detail-category"></td>
              </tr>
              <tr>
                <th scope="row">Description</th>
                <td id="detail-description"></td>
              </tr>
              <tr>
                <th scope="row">Price</th>
                <td id="detail-price"></td>
              </tr>
              <tr>
                <th scope="row">Status</th>
                <td id="detail-status"></td>
              </tr>
              <tr>
                <th scope="row">Created At</th>
                <td id="detail-created-at"></td>
              </tr>
            </tbody>
          </table>

        </div>
      </div>
    </div>

    <!-- Feedback section -->
    <div class="mt-5">

      <h4 class="mb-3">Customer Feedback</h4>

      <!-- Leave Feedback-->
      <div class="card mb-4" style="max-width:650px;">
        <div class="card-body">

          <h6 class="mb-3">Write a comment</h6>

          <div class="mb-2">
            <label class="form-label">Rating: <span id="rating-value">3</span>/5</label>

            <input
              type="range"
              min="1"
              max="5"
              value="3"
              class="form-range"
              id="rating-input"
              oninput="document.getElementById('rating-value').innerText = this.value"
            />
          </div>

          <div class="d-flex gap-4">
            <textarea
              id="comment-input"
              class="form-control"
              rows="1"
              placeholder="Add a comment..."
            ></textarea>

            <button class="btn btn-success" onclick="submitFeedback()">
              Post
            </button>
          </div>

        </div>
      </div>

      <!-- Feedback list -->
      <div id="feedback-section">
        <div id="feedback-list"></div>
      </div>

      <!-- No feedback -->
      <div id="no-feedback" class="alert alert-info mt-3" style="display:none;">
        No feedback yet. Be the first to comment.
      </div>

    </div>
  </main>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <script type="module">
    import {formatDate, createStarRating} from '../js/utilities.js';
    window.submitFeedback = submitFeedback;
    document.addEventListener('DOMContentLoaded', fetchProductDetail);
    document.addEventListener('DOMContentLoaded', fetchProductFeedback);

    async function fetchProductDetail() {
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');

      const loading = document.getElementById('loading');
      const errorMessage = document.getElementById('error-message');
      const productDetail = document.getElementById('product-detail');

      // If no product ID is present in the URL, show error immediately
      if (!productId) {
        loading.style.display = 'none';
        errorMessage.style.display = 'block';
        errorMessage.textContent = 'No product specified.';
        return;
      }

      try {
        const response = await fetch(`/products/${productId}`);
        const data = await response.json();

        loading.style.display = 'none';

        if (!data.success || !data.product) {
          errorMessage.style.display = 'block';
          return;
        }

        const product = data.product;

        document.title = `${product.name} - Member View`;
        document.getElementById('detail-name').textContent = product.name;
        document.getElementById('detail-category').textContent = product.category || '-';
        document.getElementById('detail-description').textContent = product.description || '-';
        document.getElementById('detail-price').textContent = `$${parseFloat(product.price).toFixed(2)}`;
        document.getElementById('detail-created-at').textContent = new Date(product.created_at).toLocaleDateString();

        // Render availability badge, consistent with products.html
        const statusCell = document.getElementById('detail-status');
        statusCell.innerHTML = `
          <span class="badge ${product.is_available ? 'bg-success' : 'bg-secondary'}">
            ${product.is_available ? 'Available' : 'Unavailable'}
          </span>
        `;

        productDetail.style.display = 'block';

      } catch (error) {
        console.error('Error fetching product detail:', error);
        loading.style.display = 'none';
        errorMessage.style.display = 'block';
      }
    }
    
    async function fetchProductFeedback() {
      try {
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');

        const res = await fetch(`/feedback/${productId}`);
        const data = await res.json();

        const feedbackSection = document.getElementById('feedback-section');
        const feedbackList = document.getElementById('feedback-list');
        const noFeedback = document.getElementById('no-feedback');
        
        const userIdRes = await fetch('/auth/status');
        const userIdData = await userIdRes.json();
        
        let userId = ''
        if (userIdData.authenticated) {
          userId = userIdData.user.id
        }

        if (data.success === false || data.message === "No feedback found") {
          noFeedback.style.display = 'block';
          feedbackSection.style.display = 'none';
          return;
        }

        feedbackSection.style.display = 'block';
        noFeedback.style.display = 'none';

        feedbackList.innerHTML = data.rows.map(fb => `
          <div class="card feedback-card mb-3 w-50">
            <div class="card-body">

              <div class="d-flex justify-content-between align-items-center mb-2">
                <div>${createStarRating(fb.ratings)}</div>
                <small class="text-muted">
                  ${formatDate(fb.last_updated)}
                </small>
              </div>

              <p class="mb-3" id="comment-${fb.feedback_id}">
                ${fb.comments || 'No comment provided.'}
              </p>

              ${Number(fb.member_id) === Number(userId) ? `
                <div class="d-flex gap-2 mb-2">
                  <button class="btn btn-sm btn-outline-primary"
                    onclick="startEdit()">
                    Edit
                  </button>

                  <button class="btn btn-sm btn-outline-danger"
                    onclick="deleteFeedback()">
                    Delete
                  </button>
                </div>
              ` : ''}

              <div class="d-flex gap-2 align-items-center">
                <input 
                  type="text"
                  class="form-control form-control-sm"
                  placeholder="Write a response..."
                  id="reply-input-${fb.feedback_id}"
                />

                <button 
                  class="btn btn-sm btn-primary"
                  onclick="submitReply()">
                  Post
                </button>
              </div>

            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error('Error loading feedback:', err);
      }
    }

    async function submitFeedback() {
      try {
        const productId = new URLSearchParams(window.location.search).get('id');

        const ratings = document.getElementById('rating-input').value;
        const comments = document.getElementById('comment-input').value;

        const res = await fetch('/feedback', {
          method: 'POST',
          headers: {
            'Content-Type':'application/json'
          },
          body: JSON.stringify({
            product_id: productId,
            ratings: Number(ratings),
            feedback: comments
          })
        });

        const data = await res.json();

        if (!data.success) {
          alert(data.message || 'Failed to submit feedback');
          return;
        }

        document.getElementById('comment-input').value = '';
        document.getElementById('rating-input').value = 3;
        document.getElementById('rating-value').innerText = 3;

        // refresh list
        fetchProductFeedback();

      } catch (err) {
        console.error('Error creating feedback:', err);
      }
    }
  </script>

</body>
</html>
