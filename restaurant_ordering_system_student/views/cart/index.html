<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Shopping Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="/member/products" class="btn btn-primary btn-sm">
          Products
        </a>

        <a href="/member/feedback" class="btn btn-warning btn-sm">
          Feedback
        </a>

        <a href="/member/cart" class="btn btn-info btn-sm text-white">
          Cart
        </a>

        <span class="navbar-text ms-2 me-2">
          Welcome, Member
        </span>

        <a href="/logout" class="btn btn-outline-light btn-sm">
          Logout
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-cart3"></i> Your Shopping Cart</h2>

      <button class="btn btn-primary" onclick="openAddItemModal()">
        <i class="bi bi-plus-lg"></i> Add Item to Cart
      </button>
    </div>

    <!-- Dynamic Feedback Alert Component for Back-end Error/Success Messages -->
    <div id="alert-box"
        class="alert d-none alert-dismissible fade show"
        role="alert">

        <span id="alert-msg"></span>

        <button
            type="button"
            class="btn-close"
            onclick="hideAlert()">
        </button>

    </div>

    <div id="empty-cart-view"
        class="text-center py-5 d-none bg-white rounded shadow-sm">

        <i class="bi bi-cart-x text-muted"
          style="font-size:4rem;"></i>

        <h4 class="mt-3 text-muted">
            Your cart is currently empty
        </h4>

        <p class="text-secondary">
            Explore our menu and add some delicious items!
        </p>

        <button class="btn btn-primary mt-2"
                onclick="openAddItemModal()">

            <i class="bi bi-plus-lg"></i>
            Browse & Add Items

        </button>

    </div>

    <div id="cart-content-view" class="d-none">

    </div>
  </div>

  

  <!-- Bootstrap Javascript Bundle Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
