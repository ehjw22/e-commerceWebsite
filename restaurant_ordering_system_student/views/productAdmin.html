<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Restaurant Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Restaurant System</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" id="user-welcome"></span>
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link active" href="/products-management">Products</a>
                <a class="nav-link" href="/discount">Discounts</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2>Product Management</h2>

                <p class="text-muted mb-0">
                    Manage product availability
                </p>
            </div>
        </div>

        <!-- Products Card -->
        <div class="card">
            <div class="card-body">

                <h5 class="card-title">Products</h5>

                <div id="no-products" class="alert alert-info" style="display: none;">
                    No products found.
                </div>

                <div id="products-table-container" class="table-responsive">

                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Availability</th>
                                <th>Created At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="products-tbody">
                            <!-- Products populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Edit Product Modal -->
        <div class="modal fade" id="editProductModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Product</h5>

                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">

                            <label for="edit-product-name" class="form-label">Product Name</label>

                            <input type="text" class="form-control" id="edit-product-name">
                        </div>

                        <div class="mb-3">
                            <label for="edit-product-description" class="form-label">Description</label>

                            <textarea class="form-control" id="edit-product-description" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="edit-product-category" class="form-label">Category</label>

                            <input type="text" class="form-control" id="edit-product-category">
                        </div>

                        <div class="mb-3">
                            <label for="edit-product-price" class="form-label">Price</label>

                            <input type="number" class="form-control" id="edit-product-price" step="0.01" min="0">
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="button" class="btn btn-primary" onclick="saveProduct()">
                            Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/productAdmin.js"></script>
</body>
</html>
