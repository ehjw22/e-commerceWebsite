<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Member View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="/member/products" class="btn btn-primary btn-sm">
          Products
        </a>

        <a href="/member/feedback" class="btn btn-warning btn-sm">
          Feedback
        </a>

        <span class="navbar-text ms-2 me-2">
          Welcome, Member
        </span>

        <a href="/logout" class="btn btn-outline-light btn-sm">
          Logout
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mt-4">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Available Products</h4>

        <div class="table-responsive">
          <table class="table table-striped align-middle">
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Category</th>
                <th>Price ($)</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Details</th>
                <th>Purchase</th>
              </tr>
            </thead>
            <tbody id="product-table-body"></tbody>
          </table>
        </div>
        <div class="d-flex flex-column align-items-end gap-2">
          <a id="openModal" class="btn btn-primary btn-sm w-25 openModal">
            Buy
          </a>
        </div>
        <div id="no-products" class="alert alert-info mt-3" style="display: none;">
          No products available.
        </div>

        <div class="modal fade" id="buyProductModal" tabindex="-1">
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">

              <div class="modal-header">
                <h5 class="modal-title">Buy Products</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>

              <div class="modal-body">

                <!-- Product list -->
                <div id="modal-product-list"></div>

                <hr>

                <!-- Total -->
                <div class="d-flex justify-content-between align-items-center">
                  <h5 class="mb-0">Total:</h5>
                  <h5 class="mb-0">$<span id="modal-total">0.00</span></h5>
                </div>

              </div>

              <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">
                  Close
                </button>

                <button class="btn btn-success" onclick="submitOrder()">
                  Buy Now
                </button>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', fetchProducts);

  let allProducts = [];

  async function fetchProducts() {
    try {
      const response = await fetch('/products');
      const data = await response.json();

      const tbody = document.getElementById('product-table-body');
      const noProducts = document.getElementById('no-products');

      tbody.innerHTML = '';

      if (!data.success || data.products.length === 0) {
        noProducts.style.display = 'block';
        return;
      }

      // store products globally
      allProducts = data.products;

      data.products.forEach(product => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${product.name}</td>
          <td>${product.description || '-'}</td>
          <td>${product.category || '-'}</td>
          <td>${parseFloat(product.price).toFixed(2)}</td>
          <td>
            <span class="badge ${product.is_available ? 'bg-success' : 'bg-secondary'}">
              ${product.is_available ? 'Available' : 'Unavailable'}
            </span>
          </td>
          <td>${new Date(product.created_at).toLocaleDateString()}</td>
          <td>
            <a href="/member/product-detail?id=${product.product_id}" class="btn btn-primary btn-sm">
              View Details
            </a>
          </td>
          <td>
            <button 
              class="btn btn-success btn-sm"
              onclick="buyProduct(${product.product_id})">
              Buy
            </button>
          </td>
        `;

        tbody.appendChild(row);
      });

    } catch (error) {
      console.error('Error fetching products:', error);
      alert('Failed to load products.');
    }
  }
  const cart = {}; // { productId: { price, qty } }

  function changeQty(productId, delta) {
    const product = allProducts.find(p => p.product_id === productId);

    const item = cart[productId] || { 
      qty: 0, 
      price: product ? parseFloat(product.price) : 0 
    };

    item.qty = Math.max(0, item.qty + delta);

    cart[productId] = item;

    document.getElementById(`qty-${productId}`).innerText = item.qty;

    updateTotal();
  }

  async function submitOrder() {
    const items = [];

    for (const productId in cart) {

      if (cart[productId].qty > 0) {
        items.push({
          productId: Number(productId),
          quantity: cart[productId].qty
        });
      }

    }

    if (items.length === 0) {
      alert('Please select at least one product.');
      return;
    }

    try {

      const response = await fetch('/products/purchase', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          items: items
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.message || 'Purchase failed');
      }

      alert(
        `Order #${data.orderId} placed successfully!\nTotal: $${data.totalAmount}`
      );

      // Reset cart
      Object.keys(cart).forEach(id => {
        cart[id].qty = 0;

        const qtyElement = document.getElementById(`qty-${id}`);
        if (qtyElement) {
          qtyElement.innerText = '0';
        }
      });

      updateTotal();

      const modalElement = document.getElementById('buyProductModal');
      const modal = bootstrap.Modal.getInstance(modalElement);

      if (modal) {
        modal.hide();
      }

    } catch (error) {

      console.error(error);

      alert(error.message || 'Failed to place order.');

    }
  }

  function updateTotal() {
    let total = 0;
    
    for (const id in cart) {
      // console.log(cart[id])
      total += cart[id].qty * cart[id].price;
    }

    document.getElementById("modal-total").innerText = total.toFixed(2);
  }
  // OPEN MODAL BUTTON
  document.getElementById('openModal').addEventListener('click', () => {

    const container = document.getElementById('modal-product-list');

    container.innerHTML = '';

    // show all products inside modal
    container.innerHTML = allProducts.map(p => `
    <div class="d-flex justify-content-between align-items-center mb-3">

      <div>
        <strong>${p.name}</strong><br>
        <small>$${parseFloat(p.price).toFixed(2)}</small>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary"
                onclick="changeQty(${p.product_id}, -1)">
          -
        </button>

        <span id="qty-${p.product_id}">0</span>

        <button class="btn btn-sm btn-outline-secondary"
                onclick="changeQty(${p.product_id}, 1)">
          +
        </button>
      </div>

    </div>
  `).join('');

    const modal = new bootstrap.Modal(
      document.getElementById('buyProductModal')
    );

    modal.show();
  });
  </script>
</body>
</html>
