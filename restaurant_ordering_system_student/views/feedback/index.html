<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feedback - Member View</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/feedbackHome.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>

      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3">Welcome, Member</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    <!-- Back Button -->
    <div class="mb-3">
      <a href="/member/products" class="btn btn-outline-secondary btn-sm">
        ← Back to Products
      </a>
    </div>

    <!-- Feedback Header Block -->
    <div class="container feedback-container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0">Dining Feedback</h2>
        <!-- Standardized Action Trigger: Give Feedback Button -->
        <a href="create.html" class="btn btn-success">
          <i class="bi bi-plus-circle"></i> Give Feedback
        </a>
      </div>

      <div class="row">
        <!-- Left Column: User Feedback Cards -->
        <div class="col-lg-8 mb-4">
          <h3 class="h5 text-secondary mb-3">Your Reviews</h3>
          <div id="feedbackList"></div>
        </div>

        <!-- Right Column: Admin/Staff Responses Section -->
        <div class="col-lg-4">
          <h3 class="h5 text-secondary mb-3">Responses</h3>
          <div id="responsesList">
            <!-- Dynamically populated via JS -->
            <div class="text-muted small">Loading responses...</div>
          </div>
        </div>
      </div>

    </div>
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/feedback.js"></script>
  <script src="/js/responses.js"></script>
</body>
</html>
