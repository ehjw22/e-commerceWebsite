<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - Create Feedback</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <a href="/member/products" class="btn btn-primary btn-sm">
          Products
        </a>

        <a href="/member/feedback" class="btn btn-warning btn-sm">
          Feedback
        </a>

        <a href="/member/cart" class="btn btn-info btn-sm text-white">
          Cart
        </a>

        <span class="navbar-text ms-2 me-2">
          Welcome, Member
        </span>

        <a href="/logout" class="btn btn-outline-light btn-sm">
          Logout
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="container mt-4">

    <!-- Standardized Back Button -->
    <div class="mb-3">
      <a href="/member/feedback" class="btn btn-outline-secondary btn-sm">
        ← Back to Feedback
      </a>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <!-- Form Card Container -->
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h2 class="card-title h4 mb-4 text-dark font-weight-bold">Submit New Feedback</h2>
            
            <form id="createFeedbackForm">

              <!-- Dynamic Product Dropdown -->
              <div class="mb-3">
                <label for="productSelect" class="form-label text-muted small fw-bold">SELECT PRODUCT</label>
                <select class="form-select" id="productSelect" required>
                  <option value="" disabled selected>Loading available products...</option>
                  <!-- Options will be dynamically populated here via JavaScript -->
                </select>
              </div>

              <!-- Standardized Rating Slider Section -->
              <div class="mb-3">
                <label class="form-label text-muted small fw-bold">
                  YOUR RATING: <span id="rating-value" class="text-primary fw-bold">3</span>/5
                </label>
                <input
                  type="range"
                  min="1"
                  max="5"
                  value="3"
                  class="form-range"
                  id="ratingInput"
                  oninput="document.getElementById('rating-value').innerText = this.value"
                  required
                />
              </div>

              <!-- Comments Textarea -->
              <div class="mb-4">
                <label for="commentInput" class="form-label text-muted small fw-bold">COMMENTS</label>
                <textarea class="form-control" id="commentInput" rows="4" placeholder="Add a comment about your experience..." required></textarea>
              </div>

              <!-- Action Buttons -->
              <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="/member/feedback" class="btn btn-light me-md-2">Cancel</a>
                <button type="submit" class="btn btn-success px-4">Post Feedback</button>
              </div>
            </form>

          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/createFeedback.js" defer></script>
</body>
</html>
